#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated BrushKit FFI tag to create
        required: true
        type: string
      source_revision:
        description: Exact engine source revision to embed
        required: true
        type: string
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  prepare-brushkit-ffi-release:
    name: Create verified BrushKit FFI release tag
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify source and create annotated tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          [[ "$RELEASE_TAG" =~ ^brushkit-ffi-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          resolved_revision="$(git rev-list -1 HEAD -- Cargo.toml Cargo.lock apps/brush-c crates)"
          test "$resolved_revision" = "$SOURCE_REVISION"
          git merge-base --is-ancestor "$SOURCE_REVISION" HEAD
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
            release_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
            tagged_revision="$(git rev-list -1 "$release_commit" -- Cargo.toml Cargo.lock apps/brush-c crates)"
            test "$tagged_revision" = "$SOURCE_REVISION"
            git merge-base --is-ancestor "$SOURCE_REVISION" "$release_commit"
            echo "Verified existing immutable tag $RELEASE_TAG at $release_commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" \
            -m "BrushKit FFI ${RELEASE_TAG#brushkit-ffi-v}"
          git push origin "refs/tags/$RELEASE_TAG"

  brushkit-ffi-release:
    name: Build and publish BrushKit FFI XCFramework
    needs:
      - prepare-brushkit-ffi-release
    if: ${{ always() && (startsWith(github.ref_name, 'brushkit-ffi-v') || (github.event_name == 'workflow_dispatch' && needs.prepare-brushkit-ffi-release.result == 'success')) }}
    runs-on: "macos-15"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      EXPECTED_SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || '' }}
      RELEASE_CARGO_FEATURES: image-loss-bwd-tile-16
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Install release toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal \
            --target aarch64-apple-darwin \
            --target aarch64-apple-ios \
            --target aarch64-apple-ios-sim
          rustup default 1.95.0
          cargo install cbindgen --version 0.29.4 --locked
      - name: Resolve engine source revision
        run: |
          source_revision="$(git rev-list -1 HEAD -- Cargo.toml Cargo.lock apps/brush-c crates)"
          test -n "$source_revision"
          git merge-base --is-ancestor "$source_revision" HEAD
          if [[ -n "$EXPECTED_SOURCE_REVISION" ]]; then
            test "$source_revision" = "$EXPECTED_SOURCE_REVISION"
          fi
          echo "BRUSHKIT_BUILD_REVISION=$source_revision" >> "$GITHUB_ENV"
      - name: Build profiler-off Apple XCFramework
        run: |
          env -u BRUSHKIT_CUBECL_GPU_PROFILE \
            BRUSHKIT_BUILD_REVISION="$BRUSHKIT_BUILD_REVISION" \
            BRUSHKIT_CARGO_FEATURES="$RELEASE_CARGO_FEATURES" \
            ./scripts/build_brushkit_xcframework.sh
      - name: Validate ABI, slices, identity, and archive
        id: validate
        run: |
          test "$(plutil -extract AvailableLibraries.0.SupportedArchitectures.0 raw artifacts/BrushKitFFI.xcframework/Info.plist)" = "arm64"
          test "$(plutil -extract AvailableLibraries.1.SupportedArchitectures.0 raw artifacts/BrushKitFFI.xcframework/Info.plist)" = "arm64"
          test "$(plutil -extract AvailableLibraries.2.SupportedArchitectures.0 raw artifacts/BrushKitFFI.xcframework/Info.plist)" = "arm64"

          provenance="artifacts/BrushKitFFI.xcframework/BrushKitFFI.provenance.txt"
          test -f "$provenance"
          grep -Fxq "engine_source_sha=$BRUSHKIT_BUILD_REVISION" "$provenance"
          grep -Fxq "crate_version=${RELEASE_TAG#brushkit-ffi-v}" "$provenance"
          grep -Fxq 'callable_abi=2' "$provenance"
          grep -Fxq 'additive_train_abi=4' "$provenance"
          grep -Fxq "apple_features=$RELEASE_CARGO_FEATURES" "$provenance"
          grep -Fxq 'cubecl_gpu_profile=off' "$provenance"
          grep -Fq 'rustc=rustc 1.95.0 ' "$provenance"
          grep -Fxq 'targets=aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim' "$provenance"
          cmp LICENSE artifacts/BrushKitFFI.xcframework/LICENSE

          for library in artifacts/BrushKitFFI.xcframework/*/libbrush_c.a; do
            xcrun lipo "$library" -verify_arch arm64
            grep -a -q "$BRUSHKIT_BUILD_REVISION" "$library"
            grep -a -q 'format=brushkit-build-provenance-v1;' "$library"
            grep -a -q "apple_features=$RELEASE_CARGO_FEATURES" "$library"
            grep -a -q 'cubecl_gpu_profile=off;' "$library"
            if grep -a -q "basic_stdout_device_if_supported" "$library"; then
              echo "error: CubeCL GPU profiler marker is present in $library" >&2
              exit 1
            fi
          done

          xcrun clang -std=c11 -fsyntax-only \
            -I artifacts/BrushKitFFI.xcframework/macos-arm64/Headers \
            apps/brush-c/tests/abi_v021_compat.c
          xcrun clang -std=c11 \
            -I artifacts/BrushKitFFI.xcframework/macos-arm64/Headers \
            apps/brush-c/tests/abi_release_identity.c \
            artifacts/BrushKitFFI.xcframework/macos-arm64/libbrush_c.a \
            -framework QuartzCore -framework Metal -framework Foundation \
            -framework CoreFoundation -lobjc -liconv -lc -lm \
            -o artifacts/brushkit-release-identity-smoke
          artifacts/brushkit-release-identity-smoke \
            "$BRUSHKIT_BUILD_REVISION" \
            "${RELEASE_TAG#brushkit-ffi-v}" \
            "apple_features=$RELEASE_CARGO_FEATURES"
          unzip -t artifacts/BrushKitFFI.xcframework.zip

          checksum="$(swift package compute-checksum artifacts/BrushKitFFI.xcframework.zip)"
          archive_sha256="$(shasum -a 256 artifacts/BrushKitFFI.xcframework.zip | awk '{print $1}')"
          test "$checksum" = "$archive_sha256"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
      - name: Preserve workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: BrushKitFFI-${{ env.RELEASE_TAG }}
          path: artifacts/BrushKitFFI.xcframework.zip
          if-no-files-found: error
      - name: Create GitHub release
        env:
          SWIFTPM_CHECKSUM: ${{ steps.validate.outputs.checksum }}
          ARCHIVE_SHA256: ${{ steps.validate.outputs.archive_sha256 }}
        run: |
          version="${RELEASE_TAG#brushkit-ffi-}"
          release_commit="$(git rev-parse HEAD)"
          gh release create "$RELEASE_TAG" \
            artifacts/BrushKitFFI.xcframework.zip \
            --verify-tag \
            --target "$release_commit" \
            --latest \
            --title "BrushKit FFI $version" \
            --notes "Profiler-off native BrushKit FFI built from source revision \`$BRUSHKIT_BUILD_REVISION\`.

          Apple slices:
          - macOS arm64
          - iOS arm64
          - iOS Simulator arm64

          Callable ABI version: 2. Additive V3 and V4 training entry points included. V4 progressive SH is default-disabled. Legacy v0.2.1 entry points remain available.

          Apple artifact feature set: \`$RELEASE_CARGO_FEATURES\`. CubeCL GPU profiler: off. Immutable build provenance is embedded in each native slice and recorded in \`BrushKitFFI.provenance.txt\`.

          SwiftPM checksum: \`$SWIFTPM_CHECKSUM\`
          Archive SHA-256: \`$ARCHIVE_SHA256\`"

  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref_name, 'brushkit-ffi-v') }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.3/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
